name: Build VBC Minutajes APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-vbc-minutajes-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/marcelvillalba/vbcminutajes
          mkdir -p app/src/main/res/drawable
curl -fsSL https://raw.githubusercontent.com/villalba838-boop/MINUTAJES-VBC/main/VBC_Minutajes_icon_512.png -o app/src/main/res/drawable/app_icon.png

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VBCMinutajes"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.marcelvillalba.vbcminutajes'
              compileSdk 35

              defaultConfig {
                  applicationId "com.marcelvillalba.vbcminutajes"
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"> <uses-permission android:name="android.permission.INTERNET" /> <application android:label="VBC Minutajes" android:icon="@drawable/app_icon" android:roundIcon="@drawable/app_icon" android:theme="@style/AppTheme" android:usesCleartextTraffic="false"> <activity android:name=".MainActivity" android:exported="true"> <intent-filter> <action android:name="android.intent.action.MAIN" /> <category android:name="android.intent.category.LAUNCHER" /> </intent-filter> </activity> </application> </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources> <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar"> <item name="android:fontFamily">sans</item> <item name="android:colorAccent">#F47721</item> <item name="android:statusBarColor">#171A1E</item> <item name="android:navigationBarColor">#171A1E</item> <item name="android:windowLightStatusBar">false</item> </style> </resources>
          EOF

          cat > app/src/main/java/com/marcelvillalba/vbcminutajes/MainActivity.java <<'EOF'
          package com.marcelvillalba.vbcminutajes;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private static final String APP_URL =
                  "https://vbc-minutajes-live.marcelvillalba.chatgpt.site";

              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;
              private static final int FILE_REQUEST = 1001;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  getWindow().setStatusBarColor(Color.rgb(23,26,30));
                  getWindow().setNavigationBarColor(Color.rgb(23,26,30));

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading( WebView view, WebResourceRequest request) {

                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();

                          if ("http".equalsIgnoreCase(scheme) ||
                              "https".equalsIgnoreCase(scheme)) {
                              view.loadUrl(uri.toString());
                              return true;
                          }

                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                              return true;
                          } catch (Exception e) {
                              return false;
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser( WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {

                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }

                          fileCallback = callback;

                          try {
                              startActivityForResult(
                                  params.createIntent(),
                                  FILE_REQUEST
                              );
                              return true;
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                      }
                  });

                  if (state == null) {
                      webView.loadUrl(APP_URL);
                  } else {
                      webView.restoreState(state);
                  }
              }

              @Override
              protected void onActivityResult( int requestCode, int resultCode, Intent data) {

                  if (requestCode == FILE_REQUEST) {
                      Uri[] result = null;

                      if (resultCode == RESULT_OK && data != null &&
                          data.getData() != null) {
                          result = new Uri[]{data.getData()};
                      }

                      if (fileCallback != null) {
                          fileCallback.onReceiveValue(result);
                          fileCallback = null;
                      }
                      return;
                  }

                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk VBC-Minutajes.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VBC-Minutajes-APK
          path: VBC-Minutajes.apk
          retention-days: 30
